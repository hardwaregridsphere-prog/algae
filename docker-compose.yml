version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://algae_user:algae_pass@postgres:5432/algaetree?schema=public
      - MQTT_HOST=${MQTT_HOST:-52.64.2.15}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: algae_user
      POSTGRES_PASSWORD: algae_pass
      POSTGRES_DB: algaetree
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algae_user -d algaetree"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata: