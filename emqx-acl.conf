%% Backend Service Superuser - Absolute Access
{allow, {user, "backend_service"}, subscribe, ["algaetree/#"]}.
{allow, {user, "backend_service"}, publish, ["algaetree/#"]}.

%% Device Level Restrictions
%% %u enforces that the MQTT client's authenticated username (e.g. ALGAE-000005)
%% must match the topic structure to publish or subscribe.

%% Inbound Telemetry & State (Device -> Cloud)
{allow, all, publish, ["algaetree/%u/telemetry"]}.
{allow, all, publish, ["algaetree/%u/status"]}.
{allow, all, publish, ["algaetree/%u/event"]}.
{allow, all, publish, ["algaetree/%u/relay/state"]}.

%% Outbound Configuration & Commands (Cloud -> Device)
{allow, all, subscribe, ["algaetree/%u/command"]}.
{allow, all, subscribe, ["algaetree/%u/config/#"]}.
{allow, all, subscribe, ["algaetree/%u/time/sync"]}.
{allow, all, subscribe, ["algaetree/%u/ota"]}.

%% Strict Deny Fallback
{deny, all}.